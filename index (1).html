<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#241c3d"><title>Fairy Kingdom 3D</title>
<style>
:root{--pink:#ffb7d5;--gold:#ffe39a}*{box-sizing:border-box}body{margin:0;background:#171329;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;inset:0;pointer-events:none;padding:12px;display:flex;flex-direction:column;justify-content:space-between}.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.brand,.stats,.panel{background:linear-gradient(135deg,rgba(46,35,72,.9),rgba(25,24,54,.82));border:1px solid rgba(255,226,255,.22);box-shadow:0 8px 30px #100c2480;backdrop-filter:blur(10px);border-radius:17px}.brand{padding:10px 13px}.brand b{display:block;font-size:15px}.brand small{color:#eacde8;font-size:10px}.stats{display:flex;gap:12px;padding:10px 12px;font-size:12px}.stats strong{color:var(--gold);font-size:15px}.bottom{display:flex;align-items:end;justify-content:space-between;gap:8px}.panel{pointer-events:auto;padding:10px;max-width:min(430px,76vw)}.hint{font-size:11px;color:#f1dff4;margin:0 0 8px}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button,.topbtn{border:1px solid #ffffff35;background:linear-gradient(180deg,#75558d,#493866);color:white;border-radius:12px;padding:10px 12px;font-weight:750;font-size:12px;box-shadow:0 4px 0 #241a3b;cursor:pointer}.actions button.selected{background:linear-gradient(180deg,#ffb9d6,#d86ca9);color:#42213e}.rightcontrols{display:flex;flex-direction:column;gap:8px;pointer-events:auto}.topbtn{padding:10px 13px}.toast{position:fixed;left:50%;top:19%;transform:translateX(-50%);padding:10px 16px;background:#211832ef;border:1px solid #f9c5e6;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center;max-width:90vw}.toast.show{opacity:1}.overlay{position:fixed;inset:0;background:#110d25aa;display:flex;align-items:center;justify-content:center;padding:20px}.card{max-width:420px;width:100%;text-align:center;padding:25px 20px;border-radi </style></head><body><div id="game"></div><div id="hud"><div class="top"><div class="brand"><b>🌸 FAIRY KINGDOM 3D</b><small>마법 왕국 수호대</small></div><div class="stats"><span>💎 <strong id="gold">220</strong></span><span>💗 <strong id="life">15</strong></span><span>🌙 <strong id="wave">0/8</strong></span></div></div><div class="bottom"><div class="panel"><p class="hint" id="hint">수호자 배치 버튼을 누른 뒤 초록색 발판을 터치하세요.</p><div class="actions"><button id="archer" class="selected">🏹 별빛 궁수 80G</button><button id="mage">✨ 달빛 마법사 110G</button><button id="start">웨이브 시작 ▶</button></div></div><div class="rightcontrols"><button class="topbtn" id="upgrade">⬆ 선택 강화</button><button class="topbtn" id="camera">↻ 시점 변경</button><button class="topbtn" id="reset">⟲ 다시 시작</button></div></div></div><div class="toast" id="toast"></div><div class="overlay" id="intro"><div class="card"><h1>🌷 페어리 킹덤 3D</h1><p>아름다운 수호자들이 마법 왕국을 지킵니다.<br>여성 몬스터 군단이 길을 따라 성으로 진격해요!<br><br>빈 초록 발판을 눌러 수호자를 배치하고<br>웨이브를 시작해 왕국을 지켜주세요.</p><button id="play">왕국 지키기 시작!</button><div class="legend">모바일 터치 조작 · 3D 카툰 판타지</div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const root=document.querySelector('#game'),scene=new THREE.Scene();scene.background=new THREE.Color(0x9ac8d2);scene.fog=new THREE.Fog(0x9ac8d2,24,48);const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);let camAngle=0;function setCamera(){camera.position.set(14*Math.cos(camAngle),17,19+14*Math.sin(camAngle));camera.lookAt(0,0,0)}setCamera();const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;root.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xe8f5ff,0x78608c,2));const sun=new THREE.DirectionalLight(0xfff0d5,3);sun.position.set(-8,18,10);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-20;sun.shadow.camera.right=20;sun.shadow.camera.top=20;sun.shadow.camera.bottom=-20;scene.add(sun);
const mat=(c,r=.75,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m}),mats={grass:mat(0x78b978),path:mat(0xd9bd91),edge:mat(0x8e6a91),pink:mat(0xffa8ce),gold:mat(0xffd879,.35,.35),skin:mat(0xffd2bd),white:mat(0xfff1ed),dark:mat(0x49334e),hair:mat(0x55304c),purple:mat(0x9d80d7),blue:mat(0x7fc9e9)};const floor=new THREE.Mesh(new THREE.PlaneGeometry(40,40),mats.grass);floor.rotation.x=-Math.PI/2;floor.position.y=-.12;floor.receiveShadow=true;scene.add(floor);for(let i=0;i<90;i++){let x=(Math.random()-.5)*32,z=(Math.random()-.5)*27;if(Math.abs(z)<2.3&&x>-12&&x<12)continue;let f=new THREE.Mesh(new THREE.CircleGeometry(.08+Math.random()*.12,6),mat(i%2?0x9bd18c:0xaddb91));f.rotation.x=-Math.PI/2;f.position.set(x,.005,z);scene.add(f)}
const route=[[-15,-7],[-8,-7],[-8,0],[1,0],[1,7],[9,7],[9,1],[15,1]];for(let i=1;i<route.length;i++){let a=route[i-1],b=route[i],dx=b[0]-a[0],dz=b[1]-a[1],len=Math.hypot(dx,dz),p=new THREE.Mesh(new THREE.BoxGeometry(len+.12,.12,2.5),mats.path);p.position.set((a[0]+b[0])/2,.015,(a[1]+b[1])/2);p.rotation.y=-Math.atan2(dz,dx);p.receiveShadow=true;scene.add(p);for(let side of [-1,1]){let edge=new THREE.Mesh(new THREE.BoxGeometry(len+.1,.2,.13),mats.edge);edge.position.set((a[0]+b[0])/2,.06,(a[1]+b[1])/2+side*1.3);edge.rotation.y=p.rotation.y;scene.add(edge)}}
function tree(x,z,s=1){let g=new THREE.Group(),trunk=new THREE.Mesh(new THREE.CylinderGeometry(.16,.23,1.3,7),mat(0x80543f));trunk.position.y=.65;g.add(trunk);for(let j=0;j<3;j++){let l=new THREE.Mesh(new THREE.IcosahedronGeometry(.8-j*.1,1),mat([0x438d70,0x65a77a,0x8dbb83][j]));l.position.set((j-1)*.24,1.35+j*.45,0);l.scale.set(1,1.1,1);g.add(l)}g.position.set(x,0,z);g.scale.setScalar(s);g.traverse(o=>{if(o.isMesh)o.castShadow=true});scene.add(g)}for(let i=0;i<22;i++){let x=(Math.random()-.5)*34,z=(Math.random()-.5)*27;if(Math.abs(z)<2.4&&x<12&&x>-12)continue;tree(x,z,.7+Math.random()*.55)}function flower(x,z,c){let g=new THREE.Group();for(let i=0;i<5;i++){let p=new THREE.Mesh(new THREE.SphereGeometry(.12,8,6),mat(c));p.position.set(Math.cos(i*Math.PI*2/5)*.17,.15,Math.sin(i*Math.PI*2/5)*.17);p.scale.y=.55;g.add(p)}let center=new THREE.Mesh(new THREE.SphereGeometry(.09,8,8),mats.gold);center.position.y=.17;g.add(center);g.position.set(x,0,z);scene.add(g)}for(let i=0;i<35;i++)flower((Math.random()-.5)*29,(Math.random()-.5)*23,[0xffb7d5,0xffe4a0,0xc5a8f4][i%3]);
const castle=new THREE.Group(),cb=new THREE.Mesh(new THREE.BoxGeometry(2.8,3,2.6),mat(0xf5e8df)),cr=new THREE.Mesh(new THREE.ConeGeometry(1.9,2,4),mats.purple);cb.position.y=1.5;cr.position.y=4;cr.rotation.y=Math.PI/4;castle.add(cb,cr);castle.position.set(16,0,1);scene.add(castle);
function makeGirl(kind='archer',enemy=false){let g=new THREE.Group(),skin=mat(enemy?0xffc4c0:0xffd6c3),hair=mat(enemy?[0x54264c,0x77334e,0x352b58][Math.floor(Math.random()*3)]:kind==='mage'?0x8c4c9e:0x75415a),dress=mat(enemy?[0x9e477f,0x654b9e,0xc65a83][Math.floor(Math.random()*3)]:kind==='mage'?0x8265c5:0x4e9fc0),gold=mat(0xffd879,.35,.3),dark=mat(0x493248);function mesh(geo,m,x,y,z,sx=1,sy=1,sz=1){let o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;g.add(o);return o}for(let side of [-1,1]){mesh(new THREE.CapsuleGeometry(.13,.55,4,8),skin,side*.2,.58,0,.8,1,1);mesh(new THREE.SphereGeometry(.17,12,8),dark,side*.2,.18,.1,1.1,.65,1.4)}mesh(new THREE.ConeGeometry(.58,.95,10),dress,0,1.15,0,1,1,.8);mesh(new THREE.SphereGeometry(.31,16,12),skin,0,1.85,0,.85,1.1,.8);for(let side of [-1,1]){let arm=mesh(new THREE.CapsuleGeometry(.105,.52,4,8),skin,side*.48,1.48,0);arm.rotation.z=side*-.5;mesh(new THREE.SphereGeometry(.12,10,8),skin,side*.65,1.22,.08)}mesh(new THREE.SphereGeometry(.48,20,16),skin,0,2.42,0,.88,1.05,.85);mesh(new THREE.SphereGeometry(.5,16,12),hair,0,2.68,-.09,1,.78,1);mesh(new THREE.SphereGeometry(.43,14,10),hair,0,2.35,-.32,1.08,1.15,.65);for(let i=-2;i<=2;i++){let b=mesh(new THREE.SphereGeometry(.17,10,8),hair,i*.16,2.72,.34,1,.8,.7);b.rotation.z=-i*.16}for(let side of [-1,1]){mesh(new THREE.SphereGeometry(.055,10,8),dark,side*.17,2.48,.405,.8,1.3,.5);mesh(new THREE.SphereGeometry(.018,8,8),mats.white,side*.17-.015,2.51,.44);mesh(new THREE.SphereGeometry(.065,10,8),mat(0xffa2b9),side*.29,2.32,.37,.8,.45,.4)}if(enemy){let h1=mesh(new THREE.ConeGeometry(.12,.42,8),gold,-.29,3.03,0);h1.rotation.z=-.35;let h2=mesh(new THREE.ConeGeometry(.12,.42,8),gold,.29,3.03,0);h2.rotation.z=.35;mesh(new THREE.SphereGeometry(.13,10,8),mat(0xc96aa9),0,3.13,0)}else{mesh(new THREE.ConeGeometry(.15,.42,8),gold,0,3.05,0);mesh(new THREE.SphereGeometry(.11,10,8),mats.pink,0,3.27,0)}if(kind==='archer'){let bow=mesh(new THREE.TorusGeometry(.38,.035,8,20,Math.PI),gold,.68,1.65,.03);bow.rotation.z=Math.PI/2;let arrow=mesh(new THREE.CylinderGeometry(.025,.025,.8,6),mats.white,.68,1.65,.03);arrow.rotation.z=Math.PI/2}else{let staff=mesh(new THREE.CylinderGeometry(.035,.045,1.35,8),gold,.72,1.55,0);staff.rotation.z=-.12;mesh(new THREE.IcosahedronGeometry(.22,1),mats.blue,.72,2.27,0)}return g}
const pads=[[-12,-3],[-10,2],[-5,-3],[-4,3],[0,-3],[4,3],[5,10],[12,4],[-11,-11],[-2,10]],padMeshes=[];for(let [x,z] of pads){let p=new THREE.Mesh(new THREE.CylinderGeometry(.8,.9,.2,8),mat(0x9bd5a8));p.position.set(x,.12,z);p.receiveShadow=true;p.castShadow=true;scene.add(p);let ring=new THREE.Mesh(new THREE.TorusGeometry(.72,.045,8,24),mat(0xe4ffd1));ring.rotation.x=Math.PI/2;ring.position.set(x,.24,z);scene.add(ring);padMeshes.push({x,z,used:false,mesh:p})}
let gold=220,life=15,wave=0,selected='archer',active=false,ended=false,spawned=0,spawnTotal=0,spawnTimer=0,enemies=[],guards=[],projectiles=[],clock=new THREE.Clock();const ui={gold:document.querySelector('#gold'),life:document.querySelector('#life'),wave:document.querySelector('#wave'),hint:document.querySelector('#hint'),toast:document.querySelector('#toast')};function sync(){ui.gold.textContent=gold;ui.life.textContent=life;ui.wave.textContent=wave+'/8';document.querySelector('#archer').classList.toggle('selected',selected==='archer');document.querySelector('#mage').classList.toggle('selected',selected==='mage')}let toastTimer;function toast(s){ui.toast.textContent=s;ui.toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>ui.toast.classList.remove('show'),1900)}function place(p){if(p.used||active||ended)return;let cost=selected==='archer'?80:110;if(gold<cost){toast('골드가 부족해요!');return}gold-=cost;p.used=true;let hero=makeGirl(selected,false);hero.position.set(p.x,.22,p.z);hero.scale.setScalar(.7);scene.add(hero);let pedestal=new THREE.Mesh(new THREE.CylinderGeometry(.48,.55,.3,10),mat(0xd8a6d0));pedestal.position.set(p.x,.32,p.z);scene.add(pedestal);guards.push({hero,x:p.x,z:p.z,range:selected==='archer'?6.8:7.5,rate:selected==='archer'?.8:1.35,cool:.3,level:1,kind:selected});sync();toast(selected==='archer'?'별빛 궁수가 배치됐어요!':'달빛 마법사가 배치됐어요!')}
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();renderer.domElement.addEventListener('pointerdown',e=>{let r=renderer.domElement.getBoundingClientRect();pointer.x=(e.clientX-r.left)/r.width*2-1;pointer.y=-(e.clientY-r.top)/r.height*2+1;raycaster.setFromCamera(pointer,camera);let hits=raycaster.intersectObjects(padMeshes.map(p=>p.mesh));if(hits.length)place(padMeshes.find(p=>p.mesh===hits[0].object))});function enemyGirl(){let type=Math.random()<.5?'archer':'mage',g=makeGirl(type,true);g.scale.setScalar(.68);scene.add(g);return{g,d:0,hp:55+wave*17,max:55+wave*17,speed:1.35+wave*.08,dead:false}}function posAt(d){let left=d;for(let i=1;i<route.length;i++){let a=route[i-1],b=route[i],len=Math.hypot(b[0]-a[0],b[1]-a[1]);if(left<=len){let t=left/len;return{x:a[0]+(b[0]-a[0])*t,z:a[1]+(b[1]-a[1])*t,angle:Math.atan2(b[0]-a[0],b[1]-a[1])}}left-=len}return{x:15,z:1,angle:0}}const routeLength=route.slice(1).reduce((s,b,i)=>s+Math.hypot(b[0]-route[i][0],b[1]-route[i][1]),0);function startWave(){if(active||ended||wave>=8)return;wave++;active=true;spawned=0;spawnTotal=5+wave*2;spawnTimer=.2;toast('웨이브 '+wave+' 시작! 적 몬스터가 몰려옵니다!');sync()}function projectile(from,target,kind){let m=new THREE.Mesh(kind==='archer'?new THREE.SphereGeometry(.12,8,8):new THREE.IcosahedronGeometry(.19,1),kind==='archer'?mat(0xffe18a,.3,.2):mat(0xcba6ff,.25,.25));m.position.set(from.x,2.3,from.z);scene.add(m);projectiles.push({m,target,kind,speed:kind==='archer'?12:8,damage:kind==='archer'?24:38})}
function update(dt,t){if(active&&!ended){spawnTimer-=dt;if(spawned<spawnTotal&&spawnTimer<=0){enemies.push(enemyGirl());spawned++;spawnTimer=1.25}for(let e of enemies){e.d+=e.speed*dt;let p=posAt(e.d);e.g.position.set(p.x,.18+Math.sin(t*5+e.d)*.06,p.z);e.g.rotation.y=p.angle;if(e.d>=routeLength&&!e.dead){e.dead=true;life--;scene.remove(e.g);toast('왕국의 생명력이 줄었어요!')}}}for(let guard of guards){guard.cool-=dt;let target=enemies.filter(e=>!e.dead&&e.hp>0&&Math.hypot(e.g.position.x-guard.x,e.g.position.z-guard.z)<guard.range).sort((a,b)=>b.d-a.d)[0];if(target&&guard.cool<=0){projectile(guard,target,guard.kind);guard.cool=guard.rate;guard.hero.rotation.y=Math.atan2(target.g.position.x-guard.x,target.g.position.z-guard.z)}}for(let p of projectiles){if(p.target.dead){p.m.position.y-=dt*3;continue}let dest=new THREE.Vector3(p.target.g.position.x,1.7,p.target.g.position.z),v=dest.clone().sub(p.m.position),d=v.length();if(d<.35){p.target.hp-=p.damage;if(p.target.hp<=0&&!p.target.dead){p.target.dead=true;gold+=18;scene.remove(p.target.g)}p.m.userData.remove=true}else p.m.position.add(v.normalize().multiplyScalar(p.speed*dt))}projectiles=projectiles.filter(p=>{if(p.m.userData.remove||p.m.position.y<-.5){scene.remove(p.m);return false}return true});enemies=enemies.filter(e=>!e.dead);if(life<=0){life=0;ended=true;active=false;toast('왕국이 함락됐어요. 다시 도전해보세요!')}if(active&&spawned>=spawnTotal&&enemies.length===0){active=false;if(wave===8){ended=true;toast('축하해요! 왕국을 지켜냈어요!')}else toast('웨이브 방어 성공! 다음 공격을 준비하세요.')}}function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.045);update(dt,clock.elapsedTime);renderer.render(scene,camera);sync()}animate();function reset(){gold=220;life=15;wave=0;active=false;ended=false;spawned=0;enemies.forEach(e=>scene.remove(e.g));projectiles.forEach(p=>scene.remove(p.m));guards.forEach(g=>scene.remove(g.hero));guards=[];enemies=[];projectiles=[];padMeshes.forEach(p=>p.used=false);toast('새로운 왕국 수호전이 시작됩니다!');sync()}document.querySelector('#archer').onclick=()=>{selected='archer';ui.hint.textContent='별빛 궁수 선택됨 · 빈 초록 발판을 터치하세요.';sync()};document.querySelector('#mage').onclick=()=>{selected='mage';ui.hint.textContent='달빛 마법사 선택됨 · 빈 초록 발판을 터치하세요.';sync()};document.querySelector('#start').onclick=startWave;document.querySelector('#upgrade').onclick=()=>{let g=guards[guards.length-1];if(!g){toast('먼저 수호자를 배치하세요!');return}if(gold<70){toast('강화에는 70G가 필요해요.');return}gold-=70;g.level++;g.range+=.8;g.rate=Math.max(.35,g.rate*.82);g.hero.scale.multiplyScalar(1.08);toast('마지막으로 배치한 수호자가 강화됐어요!');sync()};document.querySelector('#camera').onclick=()=>{camAngle+=Math.PI/3;setCamera()};document.querySelector('#reset').onclick=reset;document.querySelector('#play').onclick=()=>document.querySelector('#intro').style.display='none';addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))});sync();
</script></body></html>
